name: deploy recognition api

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POKELENS_FRONTEND_ORIGIN: https://pokelens-scanner.kegcrusader.chatgpt.site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check deployment configuration
        run: |
          test -n "$HF_SPACE_ID" || { echo "Set the HF_SPACE_ID repository variable."; exit 1; }
          test -n "$HF_TOKEN" || { echo "Set the HF_TOKEN repository secret."; exit 1; }

      - name: Prepare Docker Space source
        run: |
          mkdir -p "$RUNNER_TEMP/pokelens-space"
          cp -R backend/app backend/scripts backend/models backend/data backend/pyproject.toml "$RUNNER_TEMP/pokelens-space/"
          cp deploy/huggingface/Dockerfile "$RUNNER_TEMP/pokelens-space/Dockerfile"
          cp deploy/huggingface/README.md "$RUNNER_TEMP/pokelens-space/README.md"

      - name: Publish recognition API
        env:
          SPACE_BUNDLE: ${{ runner.temp }}/pokelens-space
        run: |
          python -m pip install --disable-pip-version-check huggingface_hub
          python - <<'PY'
          import json
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_SPACE_ID"]
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="docker",
              exist_ok=True,
          )
          variables = {
              "POKELENS_ENVIRONMENT": "production",
              "POKELENS_DATABASE_URL": "sqlite+aiosqlite:///./data/pokelens.db",
              "POKELENS_AUTO_CREATE_SCHEMA": "false",
              "POKELENS_CORS_ORIGINS": json.dumps(
                  [os.environ["POKELENS_FRONTEND_ORIGIN"]]
              ),
          }
          for key, value in variables.items():
              api.add_space_variable(repo_id=repo_id, key=key, value=value)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=os.environ["SPACE_BUNDLE"],
              commit_message=f"Deploy PokéLens from {os.environ['GITHUB_SHA'][:12]}",
          )
          print(f"Deployment submitted: https://huggingface.co/spaces/{repo_id}")
          PY
