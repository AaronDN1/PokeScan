[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pokelens-api"
version = "0.1.0"
description = "Production-oriented recognition API for the PokéLens card scanner"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "pydantic-settings==2.7.1",
  "Pillow==11.1.0",
  "numpy==2.2.2",
  "opencv-python-headless==4.11.0.86",
  "SQLAlchemy[asyncio]==2.0.37",
  "asyncpg==0.30.0",
  "aiosqlite==0.20.0",
  "redis==5.2.1",
  "onnxruntime==1.20.1",
  "structlog==24.4.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "pytest-cov==6.0.0",
  "ruff==0.9.2",
  "mypy==1.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "cv2"]
ignore_missing_imports = true
