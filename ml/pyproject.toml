[project]
name = "pokelens-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "onnx==1.17.0",
  "Pillow==11.1.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokelens_ml"]
